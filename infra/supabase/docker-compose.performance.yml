# Include after the main self-hosted compose file.
services:
  kong:
    environment:
      KONG_NGINX_MAIN_WORKER_RLIMIT_NOFILE: '8192'
      KONG_NGINX_EVENTS_WORKER_CONNECTIONS: '8192'
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
