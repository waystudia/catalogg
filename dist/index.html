    <script>
      (() => {
        const retirementVersion = '20260803-network-only-v2';
        const retirementKey = `wayyaam:pwa-retirement:${retirementVersion}`;

        try {
          if (window.localStorage.getItem(retirementKey) === 'done') return;
        } catch {
          // Cleanup must still run when storage is unavailable in strict modes.
        }

        const cleanupTasks = [];

        if ('serviceWorker' in navigator) {
          cleanupTasks.push(
            navigator.serviceWorker.getRegistrations().then(async (registrations) => {
              const results = await Promise.allSettled(
                registrations.map((registration) => registration.unregister())
              );
              return {
                hadLegacyState: registrations.length > 0,
                cleanupFailed: results.some((result) => result.status === 'rejected')
              };
            })
          );
        }

        if ('caches' in window) {
          cleanupTasks.push(
            window.caches.keys().then(async (cacheNames) => {
              const results = await Promise.allSettled(
                cacheNames.map((cacheName) => window.caches.delete(cacheName))
              );
              return {
                hadLegacyState: cacheNames.length > 0,
                cleanupFailed: results.some((result) => result.status === 'rejected')
              };
            })
          );
        }

        void Promise.allSettled(cleanupTasks).then((results) => {
          const cleanupFailed = results.some((result) => (
            result.status === 'rejected' || result.value.cleanupFailed
          ));
          if (cleanupFailed) return;

          try {
            window.localStorage.setItem(retirementKey, 'done');
          } catch {
            // The URL marker prevents a reload loop when storage is unavailable.
          }

          const hadLegacyState = results.some((result) => (
            result.status === 'fulfilled' && result.value.hadLegacyState
          ));
          if (!hadLegacyState) return;

          const nextUrl = new URL(window.location.href);
          if (nextUrl.searchParams.get('pwa-reset') === retirementVersion) return;
          nextUrl.searchParams.set('pwa-reset', retirementVersion);
          window.location.replace(nextUrl.toString());
        });
      })();
