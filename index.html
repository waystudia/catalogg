<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6C5CE7" />
    <meta
      name="description"
      content="WayYaam — рестораны, доставка, скидки и акции"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%assets/logo/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/logo/waycatalog-icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/logo/icon-192.png" />
    <title>WayYaam</title>
    <script>
      (() => {
        const retirementVersion = '20260803-network-only-v2';
        const retirementKey = `wayyaam:pwa-retirement:${retirementVersion}`;

        try {
          if (window.localStorage.getItem(retirementKey) === 'done') return;
          window.localStorage.setItem(retirementKey, 'done');

          const cleanupTasks = [];

          if ('serviceWorker' in navigator) {
            cleanupTasks.push(
              navigator.serviceWorker.getRegistrations().then((registrations) =>
                Promise.all(registrations.map((registration) => registration.unregister()))
              )
            );
          }

          if ('caches' in window) {
            cleanupTasks.push(
              window.caches.keys().then((cacheNames) =>
                Promise.all(cacheNames.map((cacheName) => window.caches.delete(cacheName)))
              )
            );
          }

          if (cleanupTasks.length > 0) {
            void Promise.allSettled(cleanupTasks).then(() => {
              const nextUrl = new URL(window.location.href);
              if (nextUrl.searchParams.get('pwa-reset') === retirementVersion) return;
              nextUrl.searchParams.set('pwa-reset', retirementVersion);
              window.location.replace(nextUrl.toString());
            });
          }
        } catch {
          // Storage may be unavailable in strict/private browser modes.
        }
      })();
    </script>
  </head>
  <body style="margin: 0; background: #f7f8fc">
    <div id="root">
      <main
        style="position:fixed;inset:0;display:grid;place-items:center;min-height:100dvh;padding:24px;box-sizing:border-box;background:#f7f8fc;color:#111827;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      >
        <section style="display:grid;justify-items:center;width:min(100%,320px);text-align:center">
          <img
            src="%BASE_URL%assets/logo/waycatalog-icon.svg"
            alt=""
            width="76"
            height="76"
            style="margin-bottom:16px"
          />
          <strong style="font-size:28px;line-height:1.2">WayYaam</strong>
          <span style="margin-top:8px;color:#667085;font-size:15px">Загрузка каталога</span>
          <span
            style="display:block;width:100%;height:8px;margin-top:24px;overflow:hidden;border-radius:4px;background:#e4e7ec"
          >
            <i style="display:block;width:18%;height:100%;border-radius:inherit;background:#5b3df5"></i>
          </span>
          <b style="margin-top:10px;color:#5b3df5;font-size:14px">0%</b>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
